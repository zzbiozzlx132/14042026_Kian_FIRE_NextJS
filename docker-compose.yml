services:
  fire-db:
    image: postgres:16-alpine
    container_name: kian-fire-db
    environment:
      - POSTGRES_DB=kianfire
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=kianfire2026
    ports:
      - "5432:5432"
    volumes:
      - fire-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  fire-web:
    build: .
    container_name: kian-fire-web
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:kianfire2026@fire-db:5432/kianfire?schema=public
      - NEXTAUTH_URL=https://fire.kiantr.com
      - NEXTAUTH_SECRET=kian-fire-vps-super-secret-key-18022026
      - AUTH_SECRET=kian-fire-vps-super-secret-key-18022026
      - AUTH_TRUST_HOST=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      fire-db:
        condition: service_healthy
    restart: unless-stopped
    command: ["node", "server.js"]

volumes:
  fire-pgdata:
