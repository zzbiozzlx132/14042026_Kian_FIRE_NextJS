services:
  fire-db-local:
    image: postgres:16-alpine
    container_name: kian-fire-db-local
    environment:
      - POSTGRES_DB=kianfire
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=kianfire2026
    ports:
      - "5432:5432"
    volumes:
      - fire-pgdata-local:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  fire-pgdata-local:
